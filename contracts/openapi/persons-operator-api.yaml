openapi: 3.1.0
info:
  title: Plataforma — operación del Registro Institucional de Personas
  version: 0.1.0
  description: |
    PER-002. Contrato de la superficie de operador de la plataforma; el dominio,
    persistencia e identificadores pertenecen al servicio independiente Personas.
    No sustituye contracts/openapi/person-service.yaml ni el contrato de gobierno.
    Flujo humano interactivo aprobado por el orquestador en ADR-012. Publicación
    institucional y M2M siguen pendientes; no contiene client_credentials.
    Las direcciones identity.example.invalid son marcadores de configuración,
    no un proveedor desplegado ni una autorización para configurar Keycloak.
servers:
  - url: http://127.0.0.1:8003
    description: Plataforma local; publicación institucional fuera de alcance
security:
  - operatorOidc: [openid]
x-access-control:
  default: deny
  flow: Authorization Code con PKCE S256; identidad interactiva del operador
  token-validation: Plataforma valida el OIDC del navegador; Registro valida un token delegado de plataforma con emisor y audiencia propios
  forwarding: Bearer delegado RS256 firmado por plataforma hacia Registro por loopback; no se reenvía el Bearer del navegador
  permissions: Política funcional propia de la plataforma vinculada al iss/sub OIDC verificado; no roles de Keycloak ni roles api-* genéricos
  sources: persons.source.<alias> obligatorio para datos de fuente; revisión solo expone metadatos opacos
  resources: Autorización por operación, fuente y recurso; filtro antes de total y paginación
  disclosure: 404 indistinguible para recurso inexistente o no autorizado
  logs: No raw tokens, names, external references, queries or bodies; denial audit uses pseudonymous actor_id and permission code
x-source-field-mapping:
  source_system: system
  source_entity_type: entity
  source_record_id: external_id
  namespace: Los aliases con puntos se conservan exactamente; no se confunden con entidades ni IDs externos
  legacy-input: system/entity/external_id siguen aceptados por el adaptador como aliases de los nombres públicos
  conflict-policy: Si se presentan nombre público y alias legado con valores distintos se rechaza con 422
  provenance: provenance.system se conserva y debe coincidir con source.source_system
x-registry-delegation:
  browser: OIDC Authorization Code con PKCE para la sesión humana; la plataforma valida firma, iss, aud y exp
  downstream: La plataforma firma un token RS256 nuevo para Registro; no usa client_credentials ni crea service accounts
  header: {kid: Identificador de clave de delegación confiable}
  required-header-fields: [alg, kid]
  required-claims: [iss, aud, sub, actor_iss, token_use, permissions, sources, jti, iat, nbf, exp]
  issuer: Emisor de delegación de plataforma configurado, distinto del emisor OIDC original del actor
  audience: registro-personas
  token_use: persons_delegation_v1
  subject: sub original opaco del operador; actor_iss es su issuer OIDC original
  actor-identity: La identidad para auditoría e idempotencia conserva la pareja original actor_iss/sub
  permissions: Intersección de permisos de Registro solicitados con la política funcional propia de la plataforma, indexada por iss/sub OIDC verificado
  sources: Aliases de origen acotados derivados de persons.source.<alias>; no se aceptan cabeceras de fuentes confiadas al cliente
  jti: UUID por token
  lifetime: {default-seconds: 60, maximum-seconds: 120}
  validation: Registro verifica firma, issuer, audiencia, token_use, nbf/iat/exp y límite absoluto de 120 segundos
  privacy: Sin username, nombres, correo, perfiles, DN ni secretos; no registrar tokens
paths:
  /api/v1/personas:
    post:
      operationId: operator_create_person
      summary: Registrar persona mediante la capacidad independiente Personas
      description: |
        Exige persons.register y persons.source.<source.source_system>. La procedencia
        debe tener el mismo sistema autorizado. person_id lo genera Personas.
        Nunca busca ni fusiona por nombre/correo. Idempotency-Key se conserva al
        reenviar y se aísla por actor; misma clave/contenido devuelve 201 idéntico,
        contenido distinto o referencia ocupada produce 409 genérico.
      x-required-roles: [persons.register, 'persons.source.<alias>']
      x-upstream-route: POST /v1/personas
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PersonCreate'}
      responses:
        '201':
          description: Persona creada o replay idempotente; ninguna cuenta LDAP/Keycloak creada
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: operator_list_persons
      summary: Listar personas dentro de las fuentes autorizadas
      description: |
        Exige persons.read. Las fuentes firmadas acotan el conjunto autorizado;
        sin fuente permitida, items es vacío y total es cero. Total e items se
        calculan después del filtro de autorización; orden estable por person_id.
        No hay búsqueda por nombre/correo ni privilegio global implícito.
      x-required-roles: [persons.read]
      x-data-filter-role: persons.source.<alias>
      x-upstream-route: GET /v1/personas
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página autorizada de vistas mínimas
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/personas/referencias/resolver:
    get:
      operationId: operator_resolve_reference
      summary: Resolver una referencia exacta y autorizada
      description: |
        Requiere persons.read y persons.source.<source_system>. La ausencia de vínculo
        o autorización sobre la persona resultante produce 404 sin crear nada.
        Cada valor se entrega con su nombre público o alias legado; debe existir
        uno por cada grupo. Si ambos se envían con valores diferentes responde 422.
      x-required-roles: [persons.read, 'persons.source.<alias>']
      x-upstream-route: GET /v1/referencias/resolver
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: source_system
          in: query
          required: false
          description: Origen canónico; obligatorio salvo que se entregue su alias legado system
          schema: {$ref: '#/components/schemas/Alias'}
        - name: source_entity_type
          in: query
          required: false
          description: Tipo de entidad en el origen; obligatorio salvo alias legado entity
          schema: {$ref: '#/components/schemas/Alias'}
        - name: source_record_id
          in: query
          required: false
          description: ID exacto de registro externo; obligatorio salvo alias legado external_id
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: system
          in: query
          required: false
          deprecated: true
          description: Alias legado de source_system; no admite valor conflictivo
          schema: {$ref: '#/components/schemas/Alias'}
        - name: entity
          in: query
          required: false
          deprecated: true
          description: Alias legado de source_entity_type; no admite valor conflictivo
          schema: {$ref: '#/components/schemas/Alias'}
        - name: external_id
          in: query
          required: false
          deprecated: true
          description: Alias legado de source_record_id; no admite valor conflictivo
          schema: {type: string, minLength: 1, maxLength: 200}
      x-required-query-alias-groups:
        - [source_system, system]
        - [source_entity_type, entity]
        - [source_record_id, external_id]
      responses:
        '200':
          description: Persona vinculada y autorizada
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/personas/{person_id}:
    get:
      operationId: operator_get_person
      summary: Consultar el detalle mínimo de una persona autorizada
      x-required-roles: [persons.read, 'persons.source.<alias>']
      x-upstream-route: GET /v1/personas/{person_id}
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Vista mínima sin vínculos digitales ni evidencia de titularidad
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/personas/{person_id}/referencias:
    post:
      operationId: operator_link_person_reference
      summary: Vincular una referencia a una persona seleccionada explícitamente
      description: |
        Exige persons.read, persons.review, persons.link y
        persons.source.<source.source_system> y
        acceso al person_id de destino. La interfaz debe requerir selección
        explícita de una persona que el operador pueda consultar; no asigna por
        nombre, correo ni similitud. source.source_system debe coincidir con
        provenance.system. Se reenvían procedencia y correlación al servicio;
        evidence_ref es UUID opaco, observed_at lleva zona horaria y el cuerpo
        no contiene evidencia personal ni secretos. El dominio y la auditoría
        permanecen en Personas. Devuelve 201 al crear, 200 si la referencia exacta
        pertenece ya al mismo destino, o 409 genérico si pertenece a otra persona.
        El conflicto genera un caso pendiente sin divulgar IDs existentes; nunca
        fusiona, reasigna, modifica person_id ni crea cuentas LDAP/Keycloak.
        La repetición se verifica y audita; no exige una nueva Idempotency-Key.
      x-required-roles: [persons.read, persons.review, persons.link, 'persons.source.<alias>']
      x-resource-authorization: El operador debe poder consultar el person_id seleccionado
      x-upstream-route: POST /v1/personas/{person_id}/referencias
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceReferenceLink'}
      responses:
        '201':
          description: Referencia creada y auditada en el servicio Personas
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceReference'}
        '200':
          description: Referencia exacta ya vinculada al mismo destino; sin duplicado
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceReference'}
        '401':
          description: Token ausente o inválido; error local de plataforma o reenviado por Personas
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
            WWW-Authenticate: {schema: {type: string}, description: Bearer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProblem'}
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Permiso o fuente denegados en plataforma o Personas
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProblem'}
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '404':
          description: Destino inexistente o no divulgable; error local o reenviado sin distinguir existencia
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProblem'}
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: Entrada inválida detectada por plataforma o Personas; no refleja valores de entrada
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProblem'}
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503':
          description: Configuración o dependencia no disponible en plataforma o Personas
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformProblem'}
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      operationId: operator_get_person_references
      summary: Consultar únicamente referencias de las fuentes permitidas de una persona
      description: |
        Exige persons.read y acceso a la persona. El servicio filtra las referencias
        por persons.source.<alias>; nunca devuelve orígenes fuera del alcance del
        operador. El resultado es un array, sin inventar un envelope de paginación.
      x-required-roles: [persons.read, 'persons.source.<alias>']
      x-upstream-route: GET /v1/personas/{person_id}/referencias
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Referencias exactas autorizadas; orden por sistema, entidad e identificador interno
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SourceReference'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/personas/revisiones:
    get:
      operationId: operator_list_review_cases
      summary: Consultar metadatos opacos de colisiones pendientes de referencias
      description: |
        Exige persons.review. Solo incluye casos PENDING de tipo
        source_reference_collision; no revela valores de referencia, resource_id,
        sujetos de cuenta, evidencia ni personas existentes. requested_person_id
        es nullable y en estas colisiones es null. No se permite resolver, fusionar
        ni reasignar mediante esta operación. Orden estable por created_at, case_id.
        El permiso de revisión no concede acceso a datos de fuentes ni personas.
      x-required-roles: [persons.review]
      x-upstream-route: GET /v1/revisiones
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de casos pendientes restringidos; sin operación de resolución
          headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewCasePage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Invalid'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    operatorOidc:
      type: oauth2
      description: |
        Authorization Code interactivo con PKCE S256 usando la configuración OIDC
        ya aprobada; no crea clientes ni cuentas. La política funcional se mantiene
        en la plataforma, fuera de Keycloak, y no se equipara al scope openid.
      x-pkce: S256
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/protocol/openid-connect/auth
          tokenUrl: https://identity.example.invalid/protocol/openid-connect/token
          scopes:
            openid: Identidad interactiva del operador
  parameters:
    PersonId:
      name: person_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      description: UUID opaco; si falta o es inválido se genera uno sin PII
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
  headers:
    CorrelationId:
      description: UUID de correlación saneado
      schema: {type: string, format: uuid}
  responses:
    Unauthenticated:
      description: Token ausente, inválido o no autorizado para esta audiencia
      headers:
        X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
        WWW-Authenticate: {schema: {type: string}, description: Bearer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Operación o sistema fuera del alcance de la política funcional de la plataforma
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Persona o referencia inexistente o no divulgable; respuesta indistinguible
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Requiere revisión; no revela persona existente ni permite fusión/reasignación
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Invalid:
      description: Solicitud inválida; sin reproducción de entradas ni detalles internos
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Dependencia o configuración de identidad no disponible; denegación predeterminada
      headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Alias:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_-]*(\.[a-z][a-z0-9_-]*)*$'
      description: Namespace exacto de origen; admite puntos y no se expande a un permiso global
      examples: [reduniv.conecta, reduniv.aprende, reduniv.convoca]
    SourceReference:
      type: object
      additionalProperties: false
      required: [source_system, source_entity_type, source_record_id]
      properties:
        source_system:
          allOf: [{$ref: '#/components/schemas/Alias'}]
          description: Sistema de origen autorizado; se adapta a system en Registro
        source_entity_type:
          allOf: [{$ref: '#/components/schemas/Alias'}]
          description: Tipo de entidad de origen; se adapta a entity en Registro
        source_record_id:
          type: string
          minLength: 1
          maxLength: 200
          description: ID exacto del registro de origen; se adapta a external_id, sin espacios exteriores ni caracteres de control
    SourceReferenceInput:
      type: object
      additionalProperties: false
      description: |
        Nombres públicos canónicos; cada campo acepta su alias legado. Se rechaza
        con 422 si faltan ambos nombres de un grupo o si se envían valores
        conflictivos. Las respuestas usan exclusivamente los nombres públicos.
      allOf:
        - anyOf:
            - required: [source_system]
            - required: [system]
        - anyOf:
            - required: [source_entity_type]
            - required: [entity]
        - anyOf:
            - required: [source_record_id]
            - required: [external_id]
      properties:
        source_system: {$ref: '#/components/schemas/Alias'}
        source_entity_type: {$ref: '#/components/schemas/Alias'}
        source_record_id: {type: string, minLength: 1, maxLength: 200}
        system:
          allOf: [{$ref: '#/components/schemas/Alias'}]
          deprecated: true
          description: Alias legado de source_system
        entity:
          allOf: [{$ref: '#/components/schemas/Alias'}]
          deprecated: true
          description: Alias legado de source_entity_type
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          deprecated: true
          description: Alias legado de source_record_id
    Provenance:
      type: object
      additionalProperties: false
      required: [system, evidence_ref, observed_at]
      properties:
        system: {$ref: '#/components/schemas/Alias'}
        evidence_ref: {type: string, format: uuid}
        observed_at:
          type: string
          format: date-time
          description: Zona horaria obligatoria
    SourceReferenceLink:
      type: object
      additionalProperties: false
      required: [source, provenance]
      properties:
        source: {$ref: '#/components/schemas/SourceReferenceInput'}
        provenance: {$ref: '#/components/schemas/Provenance'}
    PersonCreate:
      type: object
      additionalProperties: false
      required: [display_name, source, provenance]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: No vacío ni caracteres de control; sin espacios exteriores al almacenar
        source: {$ref: '#/components/schemas/SourceReferenceInput'}
        provenance: {$ref: '#/components/schemas/Provenance'}
    PersonView:
      type: object
      additionalProperties: false
      required: [person_id, status, display_name, created_at, updated_at]
      properties:
        person_id: {type: string, format: uuid, readOnly: true}
        status: {type: string, enum: [ACTIVE, INACTIVE, UNDER_REVIEW]}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PersonPage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PersonView'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
        total: {type: integer, minimum: 0}
    ReviewCaseView:
      type: object
      additionalProperties: false
      required: [case_id, kind, requested_person_id, created_at]
      properties:
        case_id: {type: string, format: uuid}
        kind: {type: string, enum: [source_reference_collision]}
        requested_person_id:
          type: [string, 'null']
          format: uuid
          description: Null para colisiones de referencias de esta consulta
        created_at: {type: string, format: date-time}
    ReviewCasePage:
      type: object
      additionalProperties: false
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReviewCaseView'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
        total: {type: integer, minimum: 0}
    PlatformProblem:
      type: object
      additionalProperties: true
      description: Error local de la plataforma serializado como application/json; correlación camelCase
      required: [type, title, status, detail, instance, code, correlationId]
      properties:
        type: {type: string, default: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string}
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457; no refleja entradas, identificadores ni excepciones internas
