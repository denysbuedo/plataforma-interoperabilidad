[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mes-interoperability-platform"
version = "0.1.0"
description = "Institutional interoperability platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = [
  "shared/python",
  "services/registry-api/src",
  "services/institution-service/src",
  "services/person-service/src",
  "services/notification-service/src",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=mes_common --cov=mes_registry_api --cov=mes_institution_service --cov=mes_person_service --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
